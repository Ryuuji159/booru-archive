name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    container: catthehacker/ubuntu:act-latest

    steps:
      - uses: https://github.com/actions/checkout@v4

      - name: Set up Buildx
        uses: https://github.com/docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: git.skrd.fun
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            IMAGE_TAG="$GITHUB_REF_NAME"
            TAGS="git.skrd.fun/skrd/booru-archive:${IMAGE_TAG}
git.skrd.fun/skrd/booru-archive:latest"
          else
            IMAGE_TAG="sha-$(git rev-parse --short HEAD)"
            TAGS="git.skrd.fun/skrd/booru-archive:main
git.skrd.fun/skrd/booru-archive:${IMAGE_TAG}"
          fi

          {
            echo "image=git.skrd.fun/skrd/booru-archive"
            echo "tag=$IMAGE_TAG"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max
          tags: ${{ steps.meta.outputs.tags }}
