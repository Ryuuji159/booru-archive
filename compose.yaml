x-app: &app
    build:
        context: .
        dockerfile: Dockerfile
    env_file:
        - .env
    restart: unless-stopped

services:
    app:
        <<: *app
        environment:
            CONTAINER_ROLE: web
        ports:
            - "8080:80"
        volumes:
            - ./storage:/app/storage
            - ./database:/app/database

    queue:
        <<: *app
        environment:
            CONTAINER_ROLE: queue
            RUN_MIGRATIONS: "0"
        volumes:
            - ./storage:/app/storage
            - ./database:/app/database

    scheduler:
        <<: *app
        environment:
            CONTAINER_ROLE: scheduler
            RUN_MIGRATIONS: "0"
        volumes:
            - ./storage:/app/storage
            - ./database:/app/database
